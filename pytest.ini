[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    live: hits real external services (USGS StreamStats/NSS, NRCS SDA); skipped unless HYPE_LIVE_TESTS=1
    engine: needs native MODFLOW6/MODPATH7 binaries; skipped unless HYPE_MODFLOW_BIN is set
    slow: long-running (model runs, large fixtures)

# The vendored stack (shinywidgets, flopy, ipyleaflet) emits noisy DeprecationWarnings on import.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -q --strict-markers
