# Builds, packages (Velopack), and publishes the HYPE Desktop shell when a v* tag is pushed.
# v* tags are reserved for the shell in this repo; the release created here is a NORMAL release
# (never prerelease) so `releases/latest` — used by Velopack's updater and by humans — always
# resolves to an installer. Payload releases live on desktop-payload-* prereleases.
#
# Release recipe (solo dev): bump <Version> in desktop/src/Hype.Desktop/Hype.Desktop.csproj if
# you care about the assembly metadata, then:  git tag v0.2.0 && git push origin v0.2.0
name: desktop-shell

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: desktop-shell
  cancel-in-progress: false

jobs:
  shell:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { Write-Host "::error::tag must be vX.Y.Z"; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: dotnet test desktop/Hype.Desktop.slnx -c Release --nologo

      - name: Publish self-contained
        run: >
          dotnet publish desktop/src/Hype.Desktop -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.ver.outputs.version }}
          -o desktop/publish

      - name: Install Velopack CLI
        # Pinned: packaging behavior (launcher naming, package layout) must not drift
        # between releases just because CI ran on a different day.
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous release (enables delta packages)
        continue-on-error: true   # first release has nothing to delta against
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }}

      - name: Pack (Setup.exe + self-updating portable zip + deltas)
        shell: pwsh
        run: |
          # Code signing is deliberately dormant (unsigned v1 decision). When a certificate
          # materializes, add its vpk signing flags here — e.g. --signParams or
          # --azureTrustedSignFile — gated on repo secrets.
          vpk pack --packId HypeDesktop `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir desktop/publish `
            --mainExe HypeDesktop.exe `
            --packTitle 'HYPE Desktop' `
            --packAuthors 'USACE-WRISES' `
            --icon desktop/resources/icon.ico

      - name: Normalize the portable launcher name
        shell: pwsh
        run: |
          # vpk 1.2.0 names the launcher INSIDE the portable zip after the pack title
          # ("HYPE Desktop.exe") while Setup installs and the updater both write the
          # id-named "HypeDesktop.exe" - so a portable install's first update left a
          # stale duplicate launcher behind instead of overwriting. Rename the zip
          # entry to the id name so extraction and updates agree on ONE file.
          $zip = Get-ChildItem -Recurse -Filter 'HypeDesktop-win-Portable.zip' | Select-Object -First 1
          if (-not $zip) { Write-Host '::error::portable zip not found'; exit 1 }
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $a = [System.IO.Compression.ZipFile]::Open($zip.FullName, 'Update')
          try {
            $old = $a.Entries | Where-Object { $_.FullName -eq 'HYPE Desktop.exe' }
            $new = $a.Entries | Where-Object { $_.FullName -eq 'HypeDesktop.exe' }
            if (-not $old) {
              Write-Host 'portable launcher already id-named - nothing to normalize'
            } elseif ($new) {
              $old.Delete()
              Write-Host 'dropped the redundant title-named launcher'
            } else {
              $dst = $a.CreateEntry('HypeDesktop.exe', 'Optimal')
              $s = $old.Open(); $d = $dst.Open()
              $s.CopyTo($d); $d.Dispose(); $s.Dispose()
              $old.Delete()
              Write-Host 'renamed portable launcher: HYPE Desktop.exe -> HypeDesktop.exe'
            }
          } finally { $a.Dispose() }

      - name: Upload release (installer, portable, deltas, RELEASES feed)
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }} --publish
          --releaseName "HYPE Desktop v${{ steps.ver.outputs.version }}"
          --tag ${{ github.ref_name }}

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # Fill the release body with this tag's CHANGELOG section so the GitHub release
          # page shows the same bullets users see in the app's What's new dialog. The
          # section header is redundant with the release title, so only the bullets ship.
          $tag = '${{ github.ref_name }}'
          $lines = @(Get-Content CHANGELOG.md)
          $head = $lines | Select-String -Pattern ("^## " + [regex]::Escape($tag) + " \(") |
            Select-Object -First 1
          if (-not $head) {
            Write-Host "no CHANGELOG.md section for $tag - leaving the release body as packed"
            exit 0
          }
          $rest = $lines[$head.LineNumber..($lines.Count - 1)]   # LineNumber is 1-based: skips the header
          $next = $rest | Select-String -Pattern '^## v' | Select-Object -First 1
          $section = if (-not $next) { $rest }
                     elseif ($next.LineNumber -le 1) { @() }
                     else { $rest[0..($next.LineNumber - 2)] }
          $body = ($section -join "`n").Trim()
          if (-not $body) {
            Write-Host "empty CHANGELOG.md section for $tag - leaving the release body as packed"
            exit 0
          }
          Set-Content -Encoding utf8 release-notes.md $body
          gh release edit $tag --notes-file release-notes.md

      - name: Update shell block on the rolling desktop-current manifest
        shell: pwsh
        run: |
          gh release download desktop-current --pattern latest-desktop.json --output latest-desktop.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path latest-desktop.json)) {
            Write-Host 'no desktop-current manifest yet (payload workflow has not run) - skipping shell block update'
            exit 0
          }
          $version = '${{ steps.ver.outputs.version }}'
          $base = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
          $manifest = Get-Content latest-desktop.json -Raw | ConvertFrom-Json
          $shell = [ordered]@{
            version      = $version
            installerUrl = "$base/HypeDesktop-win-Setup.exe"
            portableUrl  = "$base/HypeDesktop-win-Portable.zip"
            sha256       = ''
          }
          $manifest | Add-Member -NotePropertyName shell -NotePropertyValue $shell -Force
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 latest-desktop.json
          gh release upload desktop-current latest-desktop.json --clobber
